[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

# esbuild empaqueta también los módulos compartidos (db.mjs, mailer.mjs, worker.mjs)
# que viven fuera de netlify/functions.
[functions]
  node_bundler = "esbuild"

[[redirects]]
  from = "/api/send-confirmation"
  to = "/.netlify/functions/send-confirmation"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
